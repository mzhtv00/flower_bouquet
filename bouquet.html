// ASCII Flower Bouquet
// For starting, open cmd and run: start bouquet.html

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flower Bouquet</title>
<style>
:root{--bg:#f6f1ea;--fg:#3a2f2a;--stage:#120d1a;color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0810;--fg:#efe6f5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0810;--fg:#efe6f5;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;
  box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.stage{background:var(--stage);border-radius:18px;padding:clamp(8px,2vw,22px);
  box-shadow:0 10px 40px rgba(0,0,0,.35);max-width:100%;overflow:hidden}
pre{margin:0;font-family:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  font-size:min(2.1vw,1.7vh,17px);line-height:.96;white-space:pre;color:#ddd}
small{opacity:.7}
</style>
</head>
<body>
<div class="stage"><pre id="art" aria-label="Renkli, animasyonlu ASCII çiçek buketi"></pre></div>
<small></small>
<script>
const W=72,H=46,CX=36,CONV=27,PT=19,PB=44,RR=31;
const T={
peony:["   ,&%8~-~8%&,   ",",(&%8&%@@@%&8%&),","(8%(&%8@@@8%&)%8)","(&%8(&%@@@%&)8%&)","`(8%&%8%@%8%&%8)'"," `-.&8%&%&8%&.-' "],
peony2:["  ,&8~-~8&,  "," (&%8@@@8%&) ","(%8&%@@@%&8%)"," `(8%&@&%8)' ","  `-.&8&.-'  "],
bud:[" ,&8~8&, ","(&%@@@%&)"," `-&8&-' "]};
const PP=[[218,217,211,212,224,219,205,175],[162,168,125,132,198]];
const ST={peony:PP,peony2:PP,bud:PP};
const FL=[["peony2",36,0,.8,0],["bud",24,1,1,1],["bud",48,1,1,3],["bud",12,3,1,2],["bud",60,3,1,4],
["peony",22,4,.9,1],["peony",50,4,.9,3],["peony",36,5,.7,2],["peony2",8,7,1,0],["peony2",64,7,1,5],
["peony",14,10,.9,4],["peony",58,10,.9,1],["peony",28,10,.8,2],["peony",44,10,.8,5],
["peony",20,15,.7,3],["peony",52,15,.7,0],["peony",36,13,.6,4],
["peony2",28,15,.5,1],["peony2",44,15,.5,3],["bud",36,16,.4,2]];
const GR=[28,34,40,46,70,22];
const GY=[[17,5,"<{~~~~"],[15,10,"~{~~~"],[17,16,"{~~~~"],[17,61,"~~~~}>"],[15,57,"~~~}~"],
[17,50,"~~~~}"],[16,24,"<{~~"],[16,44,"~~}>"]];
const BOW=[" ,-. ,-. ","(  `.'  )"," `-/ \\-' ","  /   \\  "];
const RB=[196,202,208,214,220,226,190,154,118,82,46,48,51,45,39,33,27,57,93,129,165,201];
let seed=7;const lcg=()=>(seed=(seed*16807)%2147483647)/2147483647;
const FILL=[];for(let k=0;k<0;k++){const y=Math.floor(lcg()*26),hw=Math.min(34,18+y*.7);
  FILL.push([y,Math.floor(CX+(lcg()*2-1)*hw),"o.*'"[Math.floor(lcg()*4)]]);}
const PARTS=[],pick=a=>a[Math.floor(Math.random()*a.length)];

function css(n){if(n>=232){const g=8+(n-232)*10;return`rgb(${g},${g},${g})`}
  const v=n-16,l=x=>x?x*40+55:0;return`rgb(${l(Math.floor(v/36))},${l(Math.floor(v/6)%6)},${l(v%6)})`}
const esc=c=>c==="<"?"&lt;":c===">"?"&gt;":c==="&"?"&amp;":c;

let ch,cl;
function put(y,x,c,k){if(c!==" "&&y>=0&&y<H&&x>=0&&x<W){ch[y*W+x]=c;cl[y*W+x]=k}}
const free=(y,x)=>y>=0&&y<H&&x>=0&&x<W&&ch[y*W+x]===" ";

function stem(bx,by,k){const n=CONV-by;if(n<=0)return[];const p=[];
  for(let i=0;i<=n;i++)p.push(Math.round(bx+(CX-bx)*i/n));
  for(let i=0;i<n;i++){const x0=p[i],s=p[i+1]-x0,y=by+i;
    if(!s)put(y,x0,"|",k);
    else if(s>0){put(y,x0,"\\",k);for(let j=1;j<s;j++)put(y,x0+j,"_",k)}
    else{put(y,x0,"/",k);for(let j=1;j<-s;j++)put(y,x0-j,"_",k)}}
  return p}

function paper(i){const rb=[196,197,203,197][Math.floor(i/3)%4];
  for(let r=PT;r<=PB;r++){const hw=Math.floor(26-(r-PT)*.94)-Math.max(0,3-Math.abs(r-RR)),L=CX-hw,R=CX+hw,f=Math.floor(hw*.5);
    if(r===PT)for(let x=L-2;x<=R+2;x++)put(r-1,x,".-~-"[((x%4)+4)%4],211);
    put(r,L,"\\",211);put(r,R,"/",211);
    for(let x=L+1;x<R;x++)put(r,x,".:'`"[(x+r)%4],(x+r)%2?218:225);
    if(r>PT+1){put(r,CX-f,"\\",175);put(r,CX+f,"/",175)}
    if(r%5===3)for(let x=L+3+(r%2)*4;x<R-3;x+=8){put(r,x,"<",204);put(r,x+1,"3",204)}}
  const hw=Math.floor(26-(RR-PT)*.94)-3;for(let x=CX-hw+1;x<CX+hw;x++)put(RR,x,"=",rb);
  BOW.forEach((s,dy)=>[...s].forEach((c,dx)=>put(RR-1+dy,CX-4+dx,c,rb)))}

function build(i){const t=i*.35;ch=new Array(W*H).fill(" ");cl=new Array(W*H).fill(0);
  FILL.forEach(([y,x,c],k)=>put(y,x,c,[255,231,225][(i+k)%3]));
  GY.forEach(([y,x,s],k)=>[...s].forEach((c,j)=>put(y,x+j,c,GR[(k+j+Math.floor(i/4))%GR.length])));
  const heads=[];
  FL.forEach(([kind,cx,top,amp,ph],idx)=>{
    const dx=Math.round(amp*Math.sin(t*.5+ph)),by=top+T[kind].length,bx=cx+dx;
    const p=stem(bx,by,GR[idx%GR.length]),n=p.length-1;
    if(n>=4){const lc=GR[(idx+2)%GR.length];
      [[.4,-1],[.7,1]].forEach(([f,s])=>{const k=Math.floor(n*f),y=by+k,x=p[k];
        if(s<0){put(y,x-1,"~",lc);put(y,x-2,"{",lc)}else{put(y,x+1,"~",lc);put(y,x+2,"}",lc)}})}
    heads.push({top,idx,kind,bx,ph})});
  heads.sort((a,b)=>a.top-b.top||a.idx-b.idx);
  const src=[];
  heads.forEach(({top,kind,bx,ph})=>{const [pal,cp]=ST[kind],o=Math.floor(ph)+Math.floor(i/4);
    const pc=pal[o%pal.length],pc2=pal[(o+1)%pal.length],cc=cp[(Math.floor(ph)+Math.floor(i/5))%cp.length];
    T[kind].forEach((line,row)=>{const x0=bx-Math.floor(line.length/2);
      [...line].forEach((c,j)=>{if(c===" ")return;
        const k=c==="@"?cc:kind==="lavender"?pal[(Math.floor(ph)+row+Math.floor(i/2))%pal.length]:
          ".'`-=~,%".includes(c)?pc2:pc;put(top+row,x0+j,c,k)})});
    if(kind!=="lavender")src.push([bx,top+2,pc])});
  paper(i);
  [[213,0],[51,2.5]].forEach(([c,ph],k)=>{
    const x=Math.floor(CX+30*Math.sin(t*.45+ph)),y=Math.floor(13+9*Math.sin(t*.8+ph*1.7));
    [...((i+k)%2?">o<":"}o{")].forEach((w,j)=>put(y,x-1+j,w,c))});
  for(let k=0;k<14;k++){const y=Math.floor(Math.random()*27),x=Math.floor(Math.random()*W);
    if(free(y,x))put(y,x,pick("*+.'"),pick([226,231,219,123,159]))}
  if(Math.random()<.6){const [bx,y,c]=pick(src);
    PARTS.push([y+Math.random()*2,bx+(Math.random()*8-4),c,pick("`~,'*"),Math.random()*6])}
  for(let k=PARTS.length-1;k>=0;k--){const p=PARTS[k];p[0]+=.6;p[1]+=Math.sin(p[0]*.9+p[4])*.7;
    if(p[0]>=H-2)PARTS.splice(k,1);else if(free(Math.floor(p[0]),Math.floor(p[1])))
      put(Math.floor(p[0]),Math.floor(p[1]),p[3],p[2])}
  for(let x=0;x<W;x++)put(H-1,x," ",94)}

function render(i){const rows=[];
  for(let y=0;y<H;y++){let s="",last=-1;
    for(let x=0;x<W;x++){const c=ch[y*W+x];
      if(c===" "){s+=" ";continue}
      const k=cl[y*W+x];if(k!==last){if(last>=0)s+="</span>";s+=`<span style="color:${css(k)}">`;last=k}
      s+=esc(c)}
    rows.push(s+(last>=0?"</span>":""))}
  const title="✿✿";
  rows.push(" ".repeat(Math.floor((W-title.length)/2))+[...title].map((c,k)=>
    `<span style="color:${css(RB[(k+i)%RB.length])}">${c}</span>`).join(""));
  document.getElementById("art").innerHTML=rows.join("\n")}

let n=0;const step=()=>{build(n);render(n);n++};
step();
if(!matchMedia("(prefers-reduced-motion: reduce)").matches)setInterval(step,260);
</script>
</body>
</html>
